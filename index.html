
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnRepeat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>OnRepeat</h1>
    <p>Can you recognize the music video?</p>

    <div class="image-area">
      <img id="frameImage"
        src="https://raw.githubusercontent.com/jaoobarthur/mv-framed/main/images/stressed-out/001.jpg">
    </div>

    <div id="frameButtons" class="frame-buttons"></div>

    <div class="guess-row">
      <div class="autocomplete">
        <input id="guessInput" type="text"
          placeholder="Type your guess..."
          autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
      </div>

      <button id="guessButton">GUESS</button>
    </div>

    <p id="message"></p>
  </div>

  <script src="catalog.js"></script>
  <script src="script.js"></script>
</body>
</html>
